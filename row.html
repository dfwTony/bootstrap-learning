<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>row</title>
    <!-- bootstrap link  -->

                    </div>
                    <div class="col-12 col-md-6 col-lg-4">

                            <div class="card-icon">
                                <i class="bi bi-palette text-primary"></i>
                            </div>
